<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KICKZ — Streetwear Sneaker Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090E;
    }
  </style>
</head>
<body class="text-white selection:bg-[#CCFF00] selection:text-black">
<!-- ================= NAVBAR ================= -->
  <header class="fixed top-0 left-0 w-full z-40 bg-[#07090E]/80 backdrop-blur-md border-b border-neutral-800/80">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="#" class="text-2xl font-black tracking-tighter uppercase text-white hover:text-[#CCFF00] transition">
        KICKZ<span class="text-[#CCFF00]">.</span>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center space-x-8 text-xs font-bold uppercase tracking-wider text-neutral-400">
        <a href="#home" class="text-white hover:text-[#CCFF00] transition">Home</a>
        <a href="#shop" class="hover:text-white transition">Shop</a>
        <a href="#collections" class="hover:text-white transition">Collections</a>
        <a href="#about" class="hover:text-white transition">About</a>
      </nav>
      <!-- Action Icons (Search, Profile, Cart) & Mobile Menu Toggle -->
      <div class="flex items-center space-x-4">
        
        <!-- Search Button -->
        <button class="p-2 text-neutral-400 hover:text-white transition" aria-label="Search">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </button>

        <!-- Profile Button -->
        <button class="p-2 text-neutral-400 hover:text-white transition" aria-label="Account">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </button>

        <!-- Cart Button with Counter Badge -->
        <button 
          id="cart-btn" 
          class="relative p-2 text-white hover:text-[#CCFF00] transition" 
          aria-label="View Cart"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span 
            id="cart-counter" 
            class="absolute top-1 right-0 w-4 h-4 bg-[#CCFF00] text-black text-[10px] font-extrabold rounded-full flex items-center justify-center"
          >
            3
          </span>
        </button>

        <!-- Mobile Hamburger Toggle -->
        <button 
          id="nav-menu-btn" 
          class="md:hidden p-2 text-neutral-400 hover:text-white transition focus:outline-none"
          aria-label="Toggle Navigation"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

      </div>
    </div>
  </header>
  <!-- Mobile Navigation Drawer Overlay -->
  <div id="nav-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>

  <!-- Mobile Navigation Slide Drawer -->
  <aside 
    id="mobile-nav-drawer" 
    class="fixed top-0 right-0 h-full w-64 bg-[#0d1017] border-l border-neutral-800 z-50 p-6 flex flex-col justify-between transform translate-x-full transition-transform duration-300 ease-in-out md:hidden shadow-2xl"
  >
    <div>
      <div class="flex items-center justify-between pb-6 border-b border-neutral-800">
        <span class="text-sm font-bold tracking-wider uppercase text-neutral-400">Navigation</span>
        <button id="nav-close-btn" class="text-neutral-400 hover:text-white p-1">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <nav class="flex flex-col space-y-4 mt-8 text-sm font-bold uppercase tracking-wider">
        <a href="#home" class="mobile-link text-white hover:text-[#CCFF00] transition">Home</a>
        <a href="#shop" class="mobile-link text-neutral-400 hover:text-[#CCFF00] transition">Shop</a>
        <a href="#collections" class="mobile-link text-neutral-400 hover:text-[#CCFF00] transition">Collections</a>
        <a href="#about" class="mobile-link text-neutral-400 hover:text-[#CCFF00] transition">About</a>
      </nav>
    </div>

    <div class="pt-6 border-t border-neutral-800 text-[11px] text-neutral-500 uppercase tracking-widest">
      KICKZ &copy; Streetwear Drop
    </div>
  </aside>

  <main class="pt-20">
    <!-- ================= HERO SECTION ================= -->
    <section id="home" class="relative min-h-[calc(100vh-5rem)] flex items-center justify-center px-6 py-12 overflow-hidden">
      
      <!-- Background Ambient Glow -->
      <div class="absolute top-1/4 right-1/4 w-96 h-96 bg-[#CCFF00]/10 rounded-full blur-3xl pointer-events-none -z-10"></div>
      <div class="absolute bottom-10 left-10 w-80 h-80 bg-orange-600/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

      <div class="max-w-7xl w-full mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
        
        <!-- Left Content (Column 1 to 7) -->
        <div class="lg:col-span-7 space-y-6 z-10">
          
          <!-- Badge -->
          <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-xs font-bold uppercase tracking-wider text-orange-500">
            <span class="text-orange-500">✱</span> NEW DROP
          </div>

          <!-- Main Heading -->
          <h1 class="text-5xl sm:text-6xl md:text-7xl lg:text-8xl font-black uppercase tracking-tight text-white leading-[0.9]">
            Sneakers <br />
            Built For <br />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#CCFF00] to-lime-300">
              More
            </span>
          </h1>
          </section>

  </main>
<script src="script.js"></script>
</body>
</html>
